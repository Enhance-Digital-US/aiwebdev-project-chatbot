name: Evals

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/backend/**"
      - "packages/evals/**"

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm --filter backend build

      - name: Write backend dev vars
        run: |
          echo "OPENAI_API_KEY=$OPENAI_API_KEY" >> packages/backend/.dev.vars
          echo "GUARDRAIL_TIER=$GUARDRAIL_TIER" >> packages/backend/.dev.vars
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GUARDRAIL_TIER: simple

      - name: Start backend dev server
        run: |
          cd packages/backend
          npx wrangler dev --port 8787 &
          sleep 5
          curl -f --retry 5 --retry-delay 2 --retry-connrefused -X POST -H "Content-Type: application/json" -d '{"messages":[]}' http://localhost:8787/api/chat || exit 1

      - name: "Run safety evals (threshold: 100%)"
        run: |
          cd packages/evals
          npx promptfoo eval \
            --filter-pattern 'safety' \
            --output results-safety.json \
            --grader openai:gpt-4o-mini
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHATBOT_URL: http://localhost:8787
          PROMPTFOO_PASS_RATE_THRESHOLD: "100"

      - name: "Run quality evals (threshold 85%)"
        if: always()
        run: |
          cd packages/evals
          npx promptfoo eval \
            --filter-pattern 'quality' \
            --output results-quality.json \
            --grader openai:gpt-4o-mini
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHATBOT_URL: http://localhost:8787
          PROMPTFOO_PASS_RATE_THRESHOLD: "85"

      - name: "Run tool use evals (threshold 80%)"
        if: always()
        run: |
          cd packages/evals
          npx promptfoo eval \
            --filter-pattern 'tools' \
            --output results-tools.json \
            --grader openai:gpt-4o-mini
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHATBOT_URL: http://localhost:8787
          PROMPTFOO_PASS_RATE_THRESHOLD: "80"

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            packages/evals/results-*.json
